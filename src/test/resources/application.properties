# Configuração usada SOMENTE nos testes (mvn test / verify): banco H2 em memória
# assim os testes e o relatorio JaCoCo rodam sem precisar de MySQL.
spring.application.name=pousada-api-test

spring.datasource.url=jdbc:h2:mem:guesthouse-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# O seed usa sintaxe MySQL; não é carregado nos testes
spring.sql.init.mode=never

jwt.secret=VGhpc0lzQVNlY3JldEtleUZvckpXVFRlc3RzMTIzNDU2Nzg=
jwt.expiration=3600000

logging.level.org.springframework.security=WARN